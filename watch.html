<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0b09" />
<title>Puppy Tracker — Watch 🐾</title>
<link rel="icon" href="icon.svg" />
<link rel="stylesheet" href="styles.css" />

<div class="app">
  <header class="topbar">
    <div class="brand">🐾 <span>Puppy Tracker</span></div>
    <span class="pill">watch only</span>
  </header>

  <main class="view">
    <section class="section-head">
      <h2>Litter overview</h2>
      <span id="w-day" class="pill"></span>
    </section>
    <div id="w-litter" class="panel litter"><div class="empty">Loading the litter… 🐶</div></div>

    <section class="section-head" style="margin-top:24px">
      <h2>Family album 📸</h2>
      <span id="w-count" class="pill"></span>
    </section>
    <div id="w-album" class="photo-grid"></div>
  </main>
</div>

<div id="modal-root"></div>
<script type="module" src="watch.js"></script>
