<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0b09" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Puppy Tracker" />
<title>Puppy Tracker 🐾</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="stylesheet" href="styles.css" />
<!-- Chart.js for the growth graph (optional; app still works if it fails to load) -->
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

<!-- ===== Passcode gate (only shows if you set APP_PASSCODE in firebase-config.js) ===== -->
<div id="lock" class="lock hidden">
  <form id="lock-form" class="lock-card">
    <div class="lock-emoji">🐶</div>
    <h1>Puppy Tracker</h1>
    <p>Enter the family passcode</p>
    <input id="lock-input" type="password" inputmode="numeric" autocomplete="off" placeholder="Passcode" />
    <button type="submit">Unlock</button>
    <div id="lock-error" class="lock-error"></div>
  </form>
</div>

<!-- ===== App shell ===== -->
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand">🐾 <span>Puppy Tracker</span></div>
    <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">⚙️</button>
  </header>

  <div id="mode-banner" class="banner hidden"></div>

  <!-- HOME: feeding overview -->
  <main id="view-home" class="view">
    <section class="section-head" id="family-head">
      <h2 id="album-open" class="tap-title">Family album <span class="chev">›</span></h2>
      <button id="btn-family-photo" class="pill-btn">📷 Add photo</button>
    </section>
    <div id="family-strip" class="family-strip hidden"></div>
    <section class="section-head hidden" id="litter-head">
      <h2>Litter overview</h2>
      <span id="litter-day" class="pill"></span>
    </section>
    <div id="litter-table" class="panel litter hidden"></div>
    <section class="section-head">
      <h2>Feeding status</h2>
      <span id="window-label" class="pill">every 2h</span>
    </section>
    <div id="puppy-cards" class="cards"></div>
    <button id="btn-add-puppy" class="add-puppy">＋ Add a puppy</button>
  </main>

  <!-- DETAIL: single puppy -->
  <main id="view-detail" class="view hidden">
    <button id="btn-back" class="back">‹ All puppies</button>
    <div id="detail-content"></div>
  </main>

  <!-- ALBUM: full family photo album -->
  <main id="view-album" class="view hidden">
    <button id="btn-album-back" class="back">‹ Home</button>
    <section class="section-head">
      <h2>Family album 📸</h2>
      <span id="album-count" class="pill"></span>
    </section>
    <button id="btn-family-photo-album" class="btn block ghost" style="margin-bottom:14px">📷 Add a photo</button>
    <div id="album-grid" class="photo-grid"></div>
  </main>
</div>

<!-- ===== Modal host ===== -->
<div id="modal-root"></div>

<script type="module" src="app.js"></script>
